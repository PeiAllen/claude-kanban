# XcodeGen spec for the Orchestra.app SwiftUI target.
#   brew install xcodegen        # one-time
#   cd App && xcodegen generate  # produces Orchestra.xcodeproj
#   open Orchestra.xcodeproj     # build/run in Xcode (needs full Xcode, not just CLT)
#
# The app links the local OrchestraCore SwiftPM library (the daemon/CLI/MCP share it) and SwiftTerm
# for the embedded terminals.
name: Orchestra
options:
  bundleIdPrefix: com.orchestra
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  OrchestraCore:
    path: ..                       # the SwiftPM package at the repo root
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0

targets:
  Orchestra:
    type: application
    platform: macOS
    sources:
      - path: .
        excludes: ["project.yml", "README.md", "*.entitlements"]
    info:
      path: Info.plist
      properties:
        CFBundleName: Orchestra
        CFBundleDisplayName: Orchestra
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Local-only agent orchestration board."
        # Register the orchestra:// scheme so `orchestra://task/<ref>` URIs (printed by the CLI and
        # usable from Raycast/Spotlight) open the app and focus the card via onOpenURL.
        CFBundleURLTypes:
          - CFBundleURLName: com.orchestra.app.task
            CFBundleURLSchemes: [orchestra]
    entitlements:
      path: Orchestra.entitlements
    dependencies:
      - package: OrchestraCore
        product: OrchestraCore
      - package: OrchestraCore
        product: OrchestraUI
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orchestra.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # `#if DEBUG` (e.g. the ORCH_SHOW screenshot hook) is only compiled into Debug builds.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          # Xcode 16 defaults this YES, splitting the app code into a separate Orchestra.debug.dylib.
          # That dylib keeps Xcode's team-stamped signature while build-app.sh re-signs the bundle
          # ad-hoc, so dyld refuses to load it ("different Team IDs" → "could not be opened"). Build a
          # single binary like Release instead, so the installed Debug bundle launches.
          ENABLE_DEBUG_DYLIB: NO
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
