# Orchestra embedded tmux config — loaded via `tmux -L orchestra -f embedded.conf`.
# Stripped down so tmux stays invisible inside SwiftTerm and never steals the agent's keys.

set -g status off
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on

# Let the program's escape sequences reach the outer terminal (SwiftTerm) and its replies come back.
# Notably this is required for Claude Code's OSC 11 background-colour query (used to pick a light/dark
# theme) to traverse tmux — without it tmux swallows the query/response and Claude can't see our theme.
# It also lets desktop notifications / progress-bar sequences through.
set -g allow-passthrough on

# Follow the most-recently-attached client's size (SwiftTerm <-> CLI attach interop).
setw -g window-size latest
setw -g aggressive-resize on

# Selection belongs to tmux, because tmux owns the scrollback: a selection it holds is anchored to a
# HISTORY LINE, so it stays on the text while the pane scrolls. (The outer SwiftTerm holds only the one
# repainted alternate screen, so a selection anchored there would sit still while the text moved under
# it.) tmux's default drag-end is `copy-selection-and-cancel`, which copies but drops the highlight the
# instant the button comes up — the "dragging doesn't select anything" report. Keep the highlight only
# when the user is READING HISTORY (already scrolled up, so the pane is already frozen in copy mode);
# at the live bottom, copy and leave copy mode so a live agent pane can never look frozen.
# Bind BOTH copy-mode tables: tmux picks `copy-mode-vi` when the inherited VISUAL/EDITOR looks like vi,
# so binding one table alone would make the behavior depend on the user's environment.
bind -T copy-mode MouseDragEnd1Pane if-shell -F "#{==:#{scroll_position},0}" \
    "send-keys -X copy-selection-and-cancel" \
    "send-keys -X copy-selection-no-clear"
bind -T copy-mode-vi MouseDragEnd1Pane if-shell -F "#{==:#{scroll_position},0}" \
    "send-keys -X copy-selection-and-cancel" \
    "send-keys -X copy-selection-no-clear"

# Neutralize the prefix so keystrokes pass straight through to the agent.
set -g prefix None
unbind C-b

# Quiet terminal: 24-bit colour, no bells, no rename churn.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# `source-file` also applies this config to a server that survived an app/daemon upgrade. Restore tmux's
# built-in feature list first so repeated reloads cannot append duplicate custom feature entries.
set -gu terminal-features

# Advertise Sixel, synchronized updates, and hyperlinks to the outer terminal. SwiftTerm supports all
# three: Sixel lets agents such as Codex render inline images; `sync` preserves DECSET 2026 frame
# boundaries through tmux (without it, tmux emits each intermediate Codex TUI redraw separately,
# flooding SwiftTerm's main-thread render queue and making input, scrolling, and screen updates lag);
# and `hyperlinks` preserves OSC 8 so the app can intercept Orchestra's opaque transcript image
# references. The app sets TERM=xterm-256color for the tmux client (AgentTerminalView.swift), so match
# that exact terminal name.
set -as terminal-features "xterm-256color:sixel:sync:hyperlinks"
set -g allow-rename off
# The agent-vs-shell classifier (SessionManager.windows) trusts window 0 / name "agent" to identify the
# agent pane. Pin that invariant so it can never drift: don't auto-rename a window to its running command
# (would rename "agent" → "node"/"claude"), keep the agent at index 0, and never renumber a surviving
# window onto index 0 when a lower shell closes.
setw -g automatic-rename off
set -g base-index 0
set -g renumber-windows off
set -g visual-bell off
set -g bell-action none
