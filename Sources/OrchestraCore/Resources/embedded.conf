# Orchestra embedded tmux config — loaded via `tmux -L orchestra -f embedded.conf`.
# Stripped down so tmux stays invisible inside SwiftTerm and never steals the agent's keys.

set -g status off
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on

# Let the program's escape sequences reach the outer terminal (SwiftTerm) and its replies come back.
# Notably this is required for Claude Code's OSC 11 background-colour query (used to pick a light/dark
# theme) to traverse tmux — without it tmux swallows the query/response and Claude can't see our theme.
# It also lets desktop notifications / progress-bar sequences through.
set -g allow-passthrough on

# Follow the most-recently-attached client's size (SwiftTerm <-> CLI attach interop).
setw -g window-size latest
setw -g aggressive-resize on

# Neutralize the prefix so keystrokes pass straight through to the agent.
set -g prefix None
unbind C-b

# Quiet terminal: 24-bit colour, no bells, no rename churn.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Advertise Sixel to the outer terminal (SwiftTerm renders Sixel and reports it via DA). This makes
# tmux (a) tell inner programs the terminal is Sixel-capable and (b) decode + redraw Sixel images to
# the SwiftTerm client — so agents that emit Sixel (e.g. Codex) can display inline images through tmux.
# The app sets TERM=xterm-256color for the tmux client (AgentTerminalView.swift), so match that.
set -as terminal-features "xterm-256color:sixel"
set -g allow-rename off
# The agent-vs-shell classifier (SessionManager.windows) trusts window 0 / name "agent" to identify the
# agent pane. Pin that invariant so it can never drift: don't auto-rename a window to its running command
# (would rename "agent" → "node"/"claude"), keep the agent at index 0, and never renumber a surviving
# window onto index 0 when a lower shell closes.
setw -g automatic-rename off
set -g base-index 0
set -g renumber-windows off
set -g visual-bell off
set -g bell-action none
