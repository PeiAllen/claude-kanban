# Orchestra embedded tmux config — loaded via `tmux -L orchestra -f embedded.conf`.
# Stripped down so tmux stays invisible inside SwiftTerm and never steals the agent's keys.

set -g status off
set -g mouse on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on

# Let the program's escape sequences reach the outer terminal (SwiftTerm) and its replies come back.
# Notably this is required for Claude Code's OSC 11 background-colour query (used to pick a light/dark
# theme) to traverse tmux — without it tmux swallows the query/response and Claude can't see our theme.
# It also lets desktop notifications / progress-bar sequences through.
set -g allow-passthrough on

# Follow the most-recently-attached client's size (SwiftTerm <-> CLI attach interop).
setw -g window-size latest
setw -g aggressive-resize on

# Neutralize the prefix so keystrokes pass straight through to the agent.
set -g prefix None
unbind C-b

# Quiet terminal: 24-bit colour, no bells, no rename churn.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g allow-rename off
set -g visual-bell off
set -g bell-action none
