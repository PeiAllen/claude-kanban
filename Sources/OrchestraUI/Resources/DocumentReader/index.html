<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<!--
  NO REMOTE LOADS AT ALL. Every asset is bundled, so nothing legitimate needs the network, and a document
  is untrusted content: it can come from an agent, from git, or from `spawn --base origin/<branch>`.

  'unsafe-inline' is granted to STYLE only, because KaTeX sets inline styles on the spans it emits.
  Script gets no such grant, so an injected <script> cannot execute even if sanitization were bypassed
  — the CSP is the second layer, not the first.

  base-uri 'none' is deliberate and load-bearing: it forbids <base href>, which is why note-relative
  image sources are rewritten explicitly in reader.js rather than resolved by the browser.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  font-src 'self';
  connect-src 'none';
  base-uri 'none';
  form-action 'none';
  frame-src 'none';
  object-src 'none'">
<link rel="stylesheet" href="vendor/katex.min.css">
<link rel="stylesheet" href="reader.css">
</head>
<body>
<main id="doc" aria-live="polite"></main>
<!-- Order matters: katex defines the global the marked extension reads at registration time. -->
<script src="vendor/katex.min.js"></script>
<script src="vendor/marked.umd.js"></script>
<script src="vendor/marked-katex-extension.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="docpath.js"></script>
<script src="reader.js"></script>
</body>
</html>
